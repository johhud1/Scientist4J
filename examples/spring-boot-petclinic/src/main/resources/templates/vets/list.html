<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::content})}">
<section th:fragment="content">
    <h2>Veterinarians</h2>
    <ul>
        <li th:each="vet : ${vets}">
            <span th:text="${vet.firstName + ' ' + vet.lastName}"></span>
            — Specialties: <span th:text="${#strings.listJoin(vet.specialties, ', ')}"></span>
        </li>
    </ul>
</section>
</html>
