<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::content})}">
<section th:fragment="content">
    <h2 th:text="${owner.firstName + ' ' + owner.lastName}"></h2>
    <p><strong>Address:</strong> <span th:text="${owner.address}"></span></p>
    <p><strong>City:</strong> <span th:text="${owner.city}"></span></p>
    <p><strong>Telephone:</strong> <span th:text="${owner.telephone}"></span></p>

    <h3>Pets</h3>
    <ul>
        <li th:each="pet : ${owner.pets}">
            <strong th:text="${pet.name}"></strong>
            (<span th:text="${pet.type}"></span>) -
            Born on <span th:text="${pet.birthDate}"></span>
        </li>
    </ul>
</section>
</html>
